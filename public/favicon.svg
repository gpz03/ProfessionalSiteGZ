<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded dark background -->
  <rect width="180" height="180" rx="40" fill="#070b13" stroke="#1f293d" stroke-width="4"/>
  
  <!-- Server stack drawing -->
  <!-- Rack 1 (Top) -->
  <rect x="35" y="45" width="110" height="24" rx="4" fill="#0f172a" stroke="#00d8f6" stroke-width="3"/>
  <circle cx="50" cy="57" r="3.5" fill="#22c55e"/> <!-- Green status light -->
  <circle cx="64" cy="57" r="3.5" fill="#00d8f6" fill-opacity="0.8"/>
  <line x1="80" y1="57" x2="130" y2="57" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Rack 2 (Middle) -->
  <rect x="35" y="78" width="110" height="24" rx="4" fill="#0f172a" stroke="#00d8f6" stroke-width="3"/>
  <circle cx="50" cy="90" r="3.5" fill="#22c55e"/> <!-- Green status light -->
  <circle cx="64" cy="90" r="3.5" fill="#00d8f6" fill-opacity="0.8"/>
  <line x1="80" y1="90" x2="130" y2="90" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Rack 3 (Bottom) -->
  <rect x="35" y="111" width="110" height="24" rx="4" fill="#0f172a" stroke="#00d8f6" stroke-width="3"/>
  <circle cx="50" cy="123" r="3.5" fill="#eab308"/> <!-- Yellow activity light -->
  <circle cx="64" cy="123" r="3.5" fill="#00d8f6" fill-opacity="0.8"/>
  <line x1="80" y1="123" x2="130" y2="123" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- Network Connection Nodes -->
  <path d="M90 135 L90 152" stroke="#00d8f6" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>
  <circle cx="90" cy="152" r="5" fill="#00d8f6"/>
</svg>
